default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml
        # mkdocs.yml uses !!python/name: tags (pymdownx.emoji) that only --unsafe accepts.
        args: ["--unsafe"]
      - id: check-added-large-files
        # Default 500KB is too small for lecture-deck PDFs (slides/*.pdf); allow up to 10MB.
        args: ["--maxkb=10240"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # codespell is intentionally omitted: course content is Turkish and codespell only knows English.
