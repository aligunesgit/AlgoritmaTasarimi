[project]
name = "algoritma-tasarimi"
version = "0.1.0"
description = "2031211013 - Algoritma Tasarımı ders materyali"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "invoke<=2.2",
  "mkdocs-exclude<=1.0.2",
  "mkdocs-git-revision-date-localized-plugin<=1.4.5",
  "mkdocs-glightbox<=0.4",
  "mkdocs-material<=9.7",
  "mkdocs-material-extensions<=1.3.1",
  "mkdocs-same-dir<=0.1.3",
  "pre-commit<=4.1",
  "pymdown-extensions<=10.14.3",
  "pytest<=8.4.2",
  "ruff<=0.14.5",
]

[tool.ruff]
target-version = "py311"
line-length = 120
lint.select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# Her modülün alıştırma testleri kendi exercise_files/ klasöründe durur.
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = [".venv", "site", ".git"]
